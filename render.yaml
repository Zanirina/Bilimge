databases:
  - name: bilimge-db
    plan: free
    databaseName: bilimge_bd
    user: bilimge

services:
  - type: web
    plan: free
    name: bilimge-backend
    runtime: python
    rootDir: backend
    buildCommand: './build.sh'
    startCommand: 'gunicorn backend.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bilimge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: 'bilimge.onrender.com'
      - key: WEB_CONCURRENCY
        value: 4
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://bilimge.onrender.com'